# Tradução entre o Caju OS e o OpenWA. Público só para o Caju OS (com segredo);
# o OpenWA fica na rede privada (caju-openwa.internal).
app = 'caju-openwa-adapter'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  OPENWA_URL = 'http://caju-openwa.internal:2785'
  SESSION_ID = 'caju'
  SELF_URL = 'http://caju-openwa-adapter.internal:8080'
  CAJU_WEBHOOK_URL = 'https://operacoes.cajutech.net/api/whatsapp/bridge-webhook'
  DATA_DIR = '/data'

[[mounts]]
  source = 'adapter_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = 'GET'
  path = '/healthz'
  interval = '30s'
  timeout = '5s'
  grace_period = '20s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
