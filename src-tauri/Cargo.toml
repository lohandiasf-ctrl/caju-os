[package]
name = "caju-os-desktop"
version = "0.1.4"
description = "Caju OS desktop"
authors = ["Caju OS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "^2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
