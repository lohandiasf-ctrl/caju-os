app = "caju-whatsapp-bridge"
primary_region = "gru"

[build]

[env]
  PORT = "3300"

[[mounts]]
  source = "whatsapp_bridge_auth"
  destination = "/app/auth"

[[services]]
  internal_port = 3300
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
