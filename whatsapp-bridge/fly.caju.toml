# Segunda conta de WhatsApp ("Whatsapp Caju").
#
# Mesmo código do bridge, outra máquina e outro volume: cada sessão do Baileys
# precisa da sua própria pasta `auth`, e duas sessões no mesmo volume derrubam
# uma à outra.
#
# Subir (os dois segredos do bridge são obrigatórios: sem eles ele nem inicia):
#   cd whatsapp-bridge
#   flyctl apps create caju-whatsapp-bridge-caju
#   flyctl volumes create whatsapp_bridge_auth_caju --size 1 --region gru -a caju-whatsapp-bridge-caju
#   flyctl secrets set CAJU_WEBHOOK_URL=https://operacoes.cajutech.net/api/whatsapp/bridge-webhook WHATSAPP_BRIDGE_SECRET=<segredo novo> -a caju-whatsapp-bridge-caju
#   flyctl deploy -c fly.caju.toml
#
# Depois, no Worker do Caju OS, com o MESMO segredo (wrangler pelo caminho
# direto, porque o npx esbarra na política de scripts do PowerShell):
#   node_modules/.bin/wrangler.cmd secret put WHATSAPP_BRIDGE_URL_CAJU --name caju-os
#     valor: https://caju-whatsapp-bridge-caju.fly.dev
#   node_modules/.bin/wrangler.cmd secret put WHATSAPP_BRIDGE_SECRET_CAJU --name caju-os
#
# É o segredo que diz ao Caju OS de qual número veio cada mensagem, então ele
# precisa ser diferente do segredo do outro bridge.
#
# fly.toml app configuration file generated for caju-whatsapp-bridge on 2026-09-14T23:24:05-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'caju-whatsapp-bridge-caju'
primary_region = 'gru'

[build]
[env]
  PORT = '3300'

[[mounts]]
  source = 'whatsapp_bridge_auth_caju'
  destination = '/app/auth'

[http_service]
  internal_port = 3300
  force_https = true
  # Must stay always on: Baileys holds a persistent WebSocket to WhatsApp,
  # stopping the machine on idle would drop the session and lose incoming
  # messages until the next HTTP request woke it back up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 3300

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
